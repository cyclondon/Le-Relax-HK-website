  G.over = true; const L = G.L;
  const bonus = Math.round((100 - G.dmg) * 5); if (win) G.score += bonus;
  const stars = L.free || !win ? 0 : G.dmg <= 30 ? 3 : G.dmg <= 60 ? 2 : 1;
  if (!L.free && stars > (PROG[G.li] || 0)) { PROG[G.li] = stars; try { localStorage.setItem('lr-ty-prog', JSON.stringify(PROG)); } catch (e) {} }
  let best = 0, key = 'lr-ty-best-' + G.li; try { best = +localStorage.getItem(key) || 0; if (G.score > best) localStorage.setItem(key, G.score); } catch (e) {}
  $('endH').innerHTML = L.free ? t('endFree') : win ? t('win').replace('%s', lvName(L)) : t('lose');
  $('stars').textContent = L.free || !win ? '' : '★'.repeat(stars) + '☆'.repeat(3 - stars);
  $('fScore').textContent = G.score; $('best').textContent = G.score > best ? t('newBest') : t('best') + best;
  const S = t('st');
  $('fStats').innerHTML = [[G.st.locks, S.locks], [G.st.debris, S.debris], [G.st.blown, S.blown], ['HK$' + (Math.round(G.dmg * 800 / 100) * 100).toLocaleString(), S.dmg], [Math.round(G.el) + 's', S.time]].map(([n, l]) => `<div><span class="num" style="${String(n).length > 6 ? 'font-size:19px' : ''}">${n}</span><small>${l}</small></div>`).join('');
  $('adH').textContent = win && !L.free ? t('adWin') : t('adLose'); $('adP').textContent = t('adP');
  $('calls').innerHTML = `<span>${t('callH')}</span>` + [['23931419', '2393 1419'], ['26187462', '2618 7462'], ['35808136', '3580 8136']].map(([n, d], i) => `<a href="tel:+852${n}">${t('stores')[i]} ${d}</a>`).join('');
  $('waLink').href = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(t('waMsg'));
  const name = lvName(L) + ' ' + sigLabel(Math.max(...L.ph.map(p => p[0])));
  lastShare = L.free ? t('shareFree').replace('%d', Math.round(G.el)).replace('%d', G.score) : t(win ? 'shareTxt' : 'shareLose').replace('%s', name).replace('%d', G.score);
  const full = lastShare + ' ' + shareUrl();
  $('shWa').href = 'https://wa.me/?text=' + encodeURIComponent(full);
  $('shFb').href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(shareUrl()) + '&quote=' + encodeURIComponent(lastShare);
  $('shNative').style.display = navigator.share ? '' : 'none';
  $('qrBox').classList.remove('on');
  $('nextB').hidden = !(win && LV[G.li + 1] && !LV[G.li + 1].free);
  $('endOv').hidden = false; sfx(win ? 'win' : 'lose');
}
function toast(m) { const e = $('toast'); e.textContent = m; e.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => e.style.display = 'none', 2200); }
async function copyText(s) { try { await navigator.clipboard.writeText(s); toast(t('copied')); } catch (e) { const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(t('copied')); } catch (e2) {} ta.remove(); } }
$('shNative').addEventListener('click', () => { navigator.share && navigator.share({title: t('title'), text: lastShare, url: shareUrl()}).catch(() => {}); });
$('shCopy').addEventListener('click', () => copyText(lastShare + ' ' + shareUrl()));
$('shWc').addEventListener('click', () => {
  const box = $('qrBox'); box.classList.toggle('on'); copyText(lastShare + ' ' + shareUrl());
  if (box.classList.contains('on') && window.QRCode) { $('qr').innerHTML = ''; try { new QRCode($('qr'), {text: shareUrl(), width: 180, height: 180}); } catch (e) {} }
});

// ---------- menus ----------
function renderStart() {
  $('ttl').innerHTML = t('ttl');
  const ic = [ICON.rattle, ICON.pot, ICON.coin];
  $('how').innerHTML = t('how').map(([b, s], i) => `<div>${ic[i]}<span><b>${b}</b>${s}</span></div>`).join('');
  $('lvls').innerHTML = LV.map((L, i) => { const ok = unlocked(i), sc = PROG[i] || 0, mx = Math.max(...L.ph.map(p => p[0]));
    return `<button class="lv${ok ? '' : ' off'}${L.free ? ' free' : ''}" data-i="${i}" ${ok ? '' : 'disabled'}><span class="top"><svg viewBox="0 0 20 20">${SIG[mx].icon}</svg><b>${LANG === 'zh' ? L.zh : L.en}</b></span>
      <small>${L.free ? t('free') : L.yr + ' · ' + t('maxSig') + ' ' + sigLabel(mx)}</small><span class="st">${L.free ? '' : ok ? '★'.repeat(sc) + '☆'.repeat(3 - sc) : ''}</span>${ok ? '' : `<small>${t('locked')}</small>`}</button>`; }).join('');
}
function applyLang() {
  if (B) { buildBG(); hero(); }
  document.documentElement.lang = LANG === 'zh' ? 'zh-HK' : 'en';
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t(e.dataset.t));
  $('langB').textContent = LANG === 'zh' ? 'EN' : '中'; $('langB2').textContent = t('lang');
  renderStart(); if (G && G.inShop) renderShop(); pauseUI(); muteUI();
}
function setLang(l) { LANG = l; try { localStorage.setItem('lr-ty-lang', l); } catch (e) {} applyLang(); }
function start(i) { ensureAudio(); newGame(i); hintDone = i === 0 ? 0 : 9; $('startOv').hidden = true; $('endOv').hidden = true; $('shopOv').hidden = true; paused = false; pauseUI(); last = performance.now(); }
function menu() { renderStart(); $('endOv').hidden = true; $('startOv').hidden = false; G = null; WINS.forEach(w => { w.s = 'shut'; w.ha = false; }); }
$('lvls').addEventListener('click', e => { const b = e.target.closest('.lv'); if (b && !b.disabled) start(+b.dataset.i); });
$('againB').addEventListener('click', () => start(G.li)); $('nextB').addEventListener('click', () => start(G.li + 1)); $('menuB').addEventListener('click', menu);
$('langB').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh')); $('langB2').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
const pauseUI = () => { $('pauseB').innerHTML = paused ? ICON.play : ICON.pause; $('pauseB').setAttribute('aria-label', paused ? t('resume') : t('pause')); };
$('pauseB').addEventListener('click', () => { if (!G || G.over) return; paused = !paused; last = performance.now(); pauseUI(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G && !G.over) { paused = true; pauseUI(); } });
cv.addEventListener('pointerdown', e => { const r = cv.getBoundingClientRect(); tap(e.clientX - r.left, e.clientY - r.top); });

// ---------- audio ----------
let AC = null, muted = false, windG = null;
const muteUI = () => { $('muteB').innerHTML = muted ? ICON.soff : ICON.son; };
$('muteB').addEventListener('click', () => { muted = !muted; muteUI(); if (windG) windG.gain.value = 0; });
function ensureAudio() {
  if (AC) { AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  AC.noise = buf; const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = .6; windG = AC.createGain(); windG.gain.value = 0;
  src.connect(f).connect(windG).connect(AC.destination); src.start(); AC.windF = f;
}
function wind() { if (!AC || !windG) return; const on = G && !G.over && !G.inShop && !paused && !muted; const s = G ? SIG[G.ph].wind : 0; windG.gain.setTargetAtTime(on ? .05 + s * .05 + Math.sin(performance.now() / 700) * .02 * s : 0, AC.currentTime, .3); AC.windF.frequency.setTargetAtTime(380 + s * 220 + Math.sin(performance.now() / 900) * 120, AC.currentTime, .3); }
function tone(f, d, type = 'square', v = .05, at = 0) { const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + at; o.type = type; o.frequency.setValueAtTime(f, t0); g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + .02); }
function noise(d, v, freq, type = 'highpass') { const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(); s.buffer = AC.noise; f.type = type; f.frequency.value = freq; g.gain.setValueAtTime(v, AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d); s.connect(f).connect(g).connect(AC.destination); s.start(); s.stop(AC.currentTime + d); }
function sfx(k) {
  if (!AC || muted) return;
  if (k === 'lock') { tone(900, .05, 'square', .05); tone(1300, .07, 'square', .05, .05); }
  if (k === 'crash') { noise(.5, .25, 2500); tone(140, .3, 'sawtooth', .05); }
  if (k === 'whack') { noise(.12, .2, 800, 'bandpass'); tone(300, .08, 'triangle', .08); }
  if (k === 'thud') noise(.25, .25, 200, 'lowpass');
  if (k === 'thunder') noise(1.6, .35, 120, 'lowpass');
  if (k === 'coin') { tone(988, .08, 'square', .05); tone(1319, .12, 'square', .05, .08); }
  if (k === 'sig') { tone(660, .15, 'triangle', .08); tone(660, .15, 'triangle', .08, .25); }
  if (k === 'win') [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, 'triangle', .08, i * .12));
  if (k === 'lose') [392, 330, 262].forEach((f, i) => tone(f, .3, 'triangle', .08, i * .18));
}

// ---------- hero art on start screen ----------
function hero() {
  const c = $('heroCv'), r = c.getBoundingClientRect(); if (!r.width || !BG) return; c.width = r.width * 2; c.height = r.height * 2; const x = c.getContext('2d');
  const sw = BG.width, sh = sw * r.height / r.width, sy = Math.max(0, (BG.height - sh) * .55); x.drawImage(BG, 0, sy, sw, Math.min(sh, BG.height), 0, 0, c.width, c.height);
  x.fillStyle = 'rgba(15,24,32,.25)'; x.fillRect(0, 0, c.width, c.height);
}
const ro = new ResizeObserver(() => { layout(); }); ro.observe($('stage'));
layout(); applyLang(); setTimeout(hero, 80); requestAnimationFrame(loop);
}
