      if (isA || isB) { const from = isA ? (phase === 'swap' ? b : a) : (phase === 'swap' ? a : b); x = BX + (from[1] + (c - from[1]) * sw) * CS + CS / 2; y = BY + (from[0] + (r - from[0]) * sw) * CS + CS / 2; } }
    const sz = (CS - 6) * cell.s; if (sz <= 1) continue;
    const isSel = sel && sel[0] === r && sel[1] === c, isHint = hintMove && hintMove.some(h => h[0] === r && h[1] === c);
    const bump = isSel ? 1.08 : isHint ? 1 + Math.sin(now / 160) * .06 : 1;
    tileArt(X, kindOf(cell), x, y, sz * bump, cell.sp);
    if (isSel) { X.strokeStyle = '#ffb02e'; X.lineWidth = 4; rrect(X, x - sz * bump / 2 - 2, y - sz * bump / 2 - 2, sz * bump + 4, sz * bump + 4, sz * .22); X.stroke(); } }
  X.restore();
  for (const f of FLY) { X.globalAlpha = 1 - f.t; const s = (CS - 6) * (1 - f.t * .5); tileArt(X, f.kind, f.x, f.y - f.t * 60, s, null); } X.globalAlpha = 1;
  if (G.oldTip) { G.oldTipT += 1 / 60; if ((G.got.old || 0) > 0 && G.oldTipT > 3 || G.oldTipT > 9) G.oldTip = 0; // how old windows work
    const bw2 = Math.min(W - 20, 460), bh2 = 84, bx = (W - bw2) / 2, by = BY + CS * ROWS - bh2 - 10;
    X.fillStyle = 'rgba(12,16,19,.93)'; rrect(X, bx, by, bw2, bh2, 14); X.fill(); X.strokeStyle = '#d23b34'; X.lineWidth = 2; X.stroke();
    tileArt(X, 'old', bx + 44, by + bh2 / 2, 60, null);
    X.textAlign = 'left'; X.fillStyle = '#fff'; X.font = '900 18px "Noto Sans HK"'; X.fillText(t('oldH'), bx + 84, by + 34); X.fillStyle = '#c9d2d7'; X.font = '600 15px "Noto Sans HK"'; X.fillText(t('oldP'), bx + 84, by + 60); }
  X.textAlign = 'center'; for (const f of FX) { X.globalAlpha = Math.max(0, 1 - f.t / 1.2); X.font = `900 ${Math.max(22, CS * .45)}px "Noto Sans HK"`; X.lineWidth = 5; X.strokeStyle = '#000'; X.strokeText(f.txt, f.x, f.y - f.t * 40); X.fillStyle = f.c; X.fillText(f.txt, f.x, f.y - f.t * 40); } X.globalAlpha = 1;
}
function pop(x, y, txt, c) { FX.push({x, y, txt, c, t: 0}); }
function loop(now) { const dt = Math.min(.05, (now - last) / 1000 || 0); last = now; tick(dt); draw(now); hud(); requestAnimationFrame(loop); }
function hud() { if (!G) return; $('moves').textContent = G.moves; $('score').textContent = G.score; $('movesG').classList.toggle('low', G.moves <= 5); }
function renderGoals() {
  if (!G) return; const L = G.L, M = t('mat');
  const prod = `<div class="prod"><span><b>${t('prods')[G.li]}</b><small>${L.free ? t('freeSub') : t('need')}</small></span></div>`;
  $('goals').innerHTML = prod + Object.entries(L.goals).map(([k, v]) => { const left = Math.max(0, v - (G.got[k] || 0)); return `<div class="goal${left ? '' : ' ok'}" data-k="${k}" title="${M[k]}"><span class="ic"></span><span class="gl">${M[k]}</span><span class="num">${left ? left : '✓'}</span></div>`; }).join('');
  $('goals').querySelectorAll('.goal').forEach(e => e.querySelector('.ic').replaceWith(iconCanvas(e.dataset.k)));
}

// ---------- flow ----------
function newGame(i) { const L = LV[i]; G = {li: i, L, moves: L.moves, score: 0, got: {}, combo: 0, maxCombo: 0, specials: 0, over: false, oldTip: L.old ? 1 : 0, oldTipT: 0}; fill(); if (!findMove()) shuffle(); phase = 'idle'; sel = null; FX = []; FLY = []; renderGoals(); }
function win() { G.over = true; const bonus = G.moves * 60; G.score += bonus; pop(W / 2, H / 2, t('built').replace('%s', t('prods')[G.li]), '#7fe0a8'); sfx('win'); setTimeout(() => end(true), 1100); }
function end(ok) {
  G.over = true; const L = G.L, stars = L.free || !ok ? 0 : G.moves >= L.moves * .3 ? 3 : G.moves >= L.moves * .12 ? 2 : 1;
  if (!L.free && stars > (PROG[G.li] || 0)) { PROG[G.li] = stars; try { localStorage.setItem('lr-m3-prog', JSON.stringify(PROG)); } catch (e) {} }
  let best = 0; const key = 'lr-m3-best-' + G.li; try { best = +localStorage.getItem(key) || 0; if (G.score > best) localStorage.setItem(key, G.score); } catch (e) {}
  $('endH').innerHTML = L.free ? t('endFree') : ok ? t('pass') : t('fail');
  $('stars').textContent = L.free || !ok ? '' : '★'.repeat(stars) + '☆'.repeat(3 - stars);
  $('fScore').textContent = G.score; $('best').textContent = G.score > best ? t('newBest') : t('best') + best;
  const S = t('st'); $('fStats').innerHTML = [[G.moves, S.left], [G.maxCombo, S.combo], [G.specials, S.specials], ...(L.old ? [[G.got.old || 0, S.old]] : [])].map(([n, l]) => `<div><span class="num">${n}</span><small>${l}</small></div>`).join('');
  $('nextB').hidden = !(ok && !L.free && LV[G.li + 1] && !LV[G.li + 1].free);
  const where = L.free ? t('free') : t('lv').replace('%d', G.li + 1);
  LRX($('endOv'), {lang: LANG, url: LRX_URL, title: t('title'), adH: t('adH'), adP: t('adP'), waMsg: t('waMsg'), text: t('share').replace('%s', LANG === 'zh' ? where : '(' + where + ')').replace('%d', G.score)});
  $('endOv').hidden = false; if (!ok) sfx('lose');
}
function renderStart() {
  $('ttl').innerHTML = t('ttl');
  $('how').innerHTML = t('how').map(([b, s]) => `<div><span class="hic"></span><span><b>${b}</b>${s}</span></div>`).join('');
  $('how').querySelectorAll('.hic').forEach((e, i) => e.replaceWith(iconCanvas(['glass', 'hinge', 'seal'][i], 80)));
  const M = t('mat');
  $('lvls').innerHTML = LV.map((L, i) => { const ok = unlocked(i), sc = PROG[i] || 0;
    return `<button class="lv${ok ? '' : ' off'}${L.free ? ' free' : ''}" data-i="${i}" ${ok ? '' : 'disabled'}><span class="n">${L.free ? '∞' : i + 1}</span><b>${t('prods')[i]}</b>
      <small>${L.free ? t('freeSub') : Object.entries(L.goals).map(([k, v]) => M[k] + ' ' + v).join(' · ') + ' · ' + L.moves + (LANG === 'zh' ? ' 步' : ' moves')}</small>${ok ? `<span class="st">${L.free ? '' : '★'.repeat(sc) + '☆'.repeat(3 - sc)}</span>` : `<small>${t('locked')}</small>`}</button>`; }).join('');
}
function applyLang() { document.documentElement.lang = LANG === 'zh' ? 'zh-HK' : 'en'; document.querySelectorAll('[data-t]').forEach(e => e.textContent = t(e.dataset.t)); $('langB').textContent = LANG === 'zh' ? 'EN' : '中'; $('langB2').textContent = t('lang'); renderStart(); renderGoals(); muteUI(); }
function setLang(l) { LANG = l; try { localStorage.setItem('lr-m3-lang', l); } catch (e) {} applyLang(); }
function start(i) { ensureAudio(); newGame(i); $('startOv').hidden = true; $('endOv').hidden = true; last = performance.now(); }
function menu() { renderStart(); $('endOv').hidden = true; $('startOv').hidden = false; }
$('lvls').addEventListener('click', e => { const b = e.target.closest('.lv'); if (b && !b.disabled) start(+b.dataset.i); });
$('againB').addEventListener('click', () => start(G.li)); $('nextB').addEventListener('click', () => start(G.li + 1)); $('menuB').addEventListener('click', menu);
$('langB').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh')); $('langB2').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));

// ---------- audio ----------
let AC = null, muted = false;
const muteUI = () => { $('muteB').innerHTML = muted ? ICON.soff : ICON.son; };
$('muteB').addEventListener('click', () => { muted = !muted; muteUI(); });
function ensureAudio() { if (AC) { AC.resume(); return; } try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
function tone(f, d, type = 'triangle', v = .05, at = 0) { const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + at; o.type = type; o.frequency.setValueAtTime(f, t0); g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + .02); }
function sfx(k) { if (!AC || muted) return;
  if (k === 'tap') tone(520, .05, 'sine', .04); if (k === 'swap') tone(380, .07, 'sine', .05); if (k === 'nope') { tone(220, .08, 'sine', .05); tone(180, .1, 'sine', .05, .08); }
  if (k === 'match') [660, 880].forEach((f, i) => tone(f, .1, 'sine', .05, i * .05)); if (k === 'combo') [660, 880, 1100].forEach((f, i) => tone(f, .1, 'sine', .05, i * .05));
  if (k === 'line') tone(1200, .25, 'sawtooth', .025); if (k === 'blast') [330, 440, 660].forEach((f, i) => tone(f, .18, 'triangle', .07, i * .05));
  if (k === 'win') [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, 'triangle', .07, i * .12)); if (k === 'lose') [392, 330, 262].forEach((f, i) => tone(f, .3, 'triangle', .07, i * .18)); }

function hero() { const c = $('heroCv'), r = c.getBoundingClientRect(); if (!r.width) return; c.width = r.width * 2; c.height = r.height * 2; const x = c.getContext('2d'); x.scale(2, 2);
  x.fillStyle = '#1f282e'; x.fillRect(0, 0, r.width, r.height); const s = 46, cols = Math.ceil(r.width / s) + 1, kinds = ['glass', 'profile', 'hinge', 'seal', 'handle', 'old'];
  for (let j = 0; j < 4; j++) for (let i = 0; i < cols; i++) tileArt(x, kinds[(i * 3 + j * 5 + (i * j) % 4) % kinds.length], i * s + s / 2 - 10, j * s + s / 2 - 10, s - 6, (i + j) % 9 === 0 ? 'row' : null); }

const ro = new ResizeObserver(layout); ro.observe($('stage'));
layout(); applyLang(); setTimeout(hero, 60); requestAnimationFrame(loop);
if (location.search.includes('debug')) window.__m3 = () => ({G, grid, runs, findMove, tryMove: (a, b) => tryMove(a, b), phase: () => phase});
}
</script>
