  LRX($('endOv'), {lang: LANG, url: LRX_URL, title: t('title'), adH: t('adH'), adP: t('adP'), waMsg: t('waMsg'), text: t('share').replace('%s', LANG === 'zh' ? where : '(' + where + ')').replace('%n', G.done).replace('%d', G.score)});
  $('endOv').hidden = false; sfx(win || L.free ? 'win' : 'lose');
}
function renderStart() {
  $('ttl').innerHTML = t('ttl'); const ic = [ICON.h1, ICON.h2, ICON.h3];
  $('how').innerHTML = t('how').map(([b, s], i) => `<div>${ic[i]}<span><b>${b}</b>${s}</span></div>`).join('');

      <small>${L.free ? t('freeSub') : (L.sites ? t('cardB') : t('cardA')) + ' · ' + L.target + ' ' + t('orders')}</small>${ok ? `<span class="st">${L.free ? '' : '★'.repeat(sc) + '☆'.repeat(3 - sc)}</span>` : `<small>${t('locked')}</small>`}</button>`; }).join('');
}
function applyLang() { document.documentElement.lang = LANG === 'zh' ? 'zh-HK' : 'en'; document.querySelectorAll('[data-t]').forEach(e => e.textContent = t(e.dataset.t)); $('langB').textContent = LANG === 'zh' ? 'EN' : '中'; $('langB2').textContent = t('lang'); renderStart(); pauseUI(); muteUI(); hero(); if (W) buildMap(); }
function setLang(l) { LANG = l; try { localStorage.setItem('lr-dl-lang', l); } catch (e) {} applyLang(); }
function start(i) { ensureAudio(); newGame(i); $('startOv').hidden = true; $('endOv').hidden = true; paused = false; pauseUI(); last = performance.now(); }
function menu() { renderStart(); $('endOv').hidden = true; $('startOv').hidden = false; G = null; V = []; T = []; }
$('lvls').addEventListener('click', e => { const b = e.target.closest('.lv'); if (b && !b.disabled) start(+b.dataset.i); });
$('againB').addEventListener('click', () => start(G.li)); $('nextB').addEventListener('click', () => start(G.li + 1)); $('menuB').addEventListener('click', menu);
$('langB').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh')); $('langB2').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
const pauseUI = () => { $('pauseB').innerHTML = paused ? ICON.play : ICON.pause; };
$('pauseB').addEventListener('click', () => { if (!G || G.over) return; paused = !paused; last = performance.now(); pauseUI(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G && !G.over) { paused = true; pauseUI(); } });

// ---------- audio ----------
let AC = null, muted = false;
const muteUI = () => { $('muteB').innerHTML = muted ? ICON.soff : ICON.son; };
$('muteB').addEventListener('click', () => { muted = !muted; muteUI(); });
function ensureAudio() { if (AC) { AC.resume(); return; } try { AC = new (window.AudioContext || window.webkitAudioContext)(); const len = AC.sampleRate, b = AC.createBuffer(1, len, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; AC.noise = b; } catch (e) { AC = null; } }
function tone(f, d, type = 'triangle', v = .05, at = 0) { const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + at; o.type = type; o.frequency.setValueAtTime(f, t0); g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + .02); }
function sfx(k) { if (!AC || muted) return;
  if (k === 'ok') [660, 880].forEach((f, i) => tone(f, .12, 'sine', .06, i * .08)); if (k === 'route') tone(520, .06, 'sine', .04);
  if (k === 'hold') tone(300, .12, 'square', .03);
  if (k === 'crash') { const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = AC.noise; g.gain.setValueAtTime(.25, AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + .5); s.connect(g).connect(AC.destination); s.start(); s.stop(AC.currentTime + .5); tone(140, .3, 'sawtooth', .05); }
  if (k === 'win') [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, 'triangle', .07, i * .12)); if (k === 'lose') [392, 330, 262].forEach((f, i) => tone(f, .3, 'triangle', .07, i * .18)); }

const SHOPS = [['tm', '26187462', '2618 7462'], ['tkt', '23931419', '2393 1419'], ['ft', '35808136', '3580 8136']];
function hero() { const D = t('dest'); $('hero').innerHTML = SHOPS.map(([k]) => `<figure><img src="store-${k}.jpg" alt="${D[k]}" loading="lazy"><figcaption style="background:${DEST[k].c}">${D[k]}</figcaption></figure>`).join('');
  $('storesH').textContent = t('stH'); $('stores').innerHTML = SHOPS.map(([k, tel, show]) => `<a href="tel:+852${tel}"><img src="store-${k}.jpg" alt="${D[k]}" loading="lazy"><span style="background:${DEST[k].c}">${D[k]}</span><small>☎ ${show}</small></a>`).join(''); }

const ro = new ResizeObserver(layout); ro.observe($('stage'));
layout(); applyLang(); requestAnimationFrame(loop);
