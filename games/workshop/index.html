function ensureAudio() { if (AC) { AC.resume(); return; } try { AC = new (window.AudioContext || window.webkitAudioContext)(); const len = AC.sampleRate, b = AC.createBuffer(1, len, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; AC.noise = b; } catch (e) { AC = null; } }
function tone(f, d, type = 'square', v = .05, at = 0) { const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + at; o.type = type; o.frequency.setValueAtTime(f, t0); g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + .02); }
function noise(d, v, freq, type = 'highpass') { const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(); s.buffer = AC.noise; f.type = type; f.frequency.value = freq; g.gain.setValueAtTime(v, AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d); s.connect(f).connect(g).connect(AC.destination); s.start(); s.stop(AC.currentTime + d); }
function sfx(k) { if (!AC || muted) return;

  if (k === 'click') { tone(1200, .04, 'square', .05); tone(800, .05, 'square', .04, .04); }
  if (k === 'clunk') { noise(.12, .18, 400, 'lowpass'); tone(220, .1, 'triangle', .07); }
  if (k === 'move') tone(500, .03, 'square', .02);
  if (k === 'nope') tone(200, .1, 'triangle', .05);
  if (k === 'smear') tone(200, .08, 'triangle', .05);
  if (k === 'done') { tone(784, .1, 'triangle', .07); tone(1046, .14, 'triangle', .07, .08); }
  if (k === 'perfect') [784, 988, 1175, 1568].forEach((f, i) => tone(f, .14, 'triangle', .07, i * .07));
  if (k === 'break') { noise(.6, .3, 2500); tone(160, .3, 'sawtooth', .05); }
  if (k === 'win') [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, 'triangle', .08, i * .12));
  if (k === 'lose') [392, 330, 262].forEach((f, i) => tone(f, .3, 'triangle', .08, i * .18)); }
